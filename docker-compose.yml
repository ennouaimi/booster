version: '3.8'

services:
  db:
    image: postgres:16-alpine # Use a lightweight, stable PostgreSQL image
    container_name: postgres-db
    restart: always # Always restart if it stops
    environment:
      # Database access configuration
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      # Expose port 5432 on the host for easy connection with external tools
      - "5432:5432"
    volumes:
      # Persist data to a named volume to keep data even if the container is removed
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: